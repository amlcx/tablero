syntax = "proto3";

package api.v1;

import "google/protobuf/timestamp.proto";
import "buf/validate/validate.proto";
import "api/v1/media.proto";
import "api/v1/pagination.proto";

option go_package = "github.com/amlcx/tablero/backend/gen/api/v1;apiv1";

message Category {
  string id = 1;
  string created_by = 2;
  string updated_by = 3;
  string name = 4;
  string short_name = 5;
  string blurb = 6;
  bool nsfw = 7;
  Media media = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  google.protobuf.Timestamp deleted_at = 11;
}

message CreateRequest {
  string name = 1 [(buf.validate.field).string = {
    min_len: 1,
    max_len: 32,
  }];
  string short_name = 2 [(buf.validate.field).string = {
    min_len: 1,
    max_len: 4,
  }];
  string blurb = 3 [(buf.validate.field).string = {
    min_len: 1,
    max_len: 256,
  }];
  bool nsfw = 4;
  bytes media = 5;
}

message CreateResponse {
  Category category = 1;
}

message ListRequest {
  PaginationParameters pagination = 1;
  bool include_deleted = 2;
}

message ListResponse {
  repeated Category categories = 1;
}

message SelectByIDRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  bool include_deleted = 2;
}

message SelectByIDResponse {
  Category category = 1;
}

message SelectByShortNameRequest {
  string short_name = 1;
  bool include_deleted = 2;
}

message SelectByShortNameResponse {
  Category category = 1;
}

service CategoryService {
  rpc Create(CreateRequest) returns (CreateResponse);
  rpc List(ListRequest) returns (ListResponse);
  rpc SelectByID(SelectByIDRequest) returns (SelectByIDResponse);
  rpc SelectByShortName(SelectByShortNameRequest) returns (SelectByShortNameResponse);
}